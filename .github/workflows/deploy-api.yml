# Publishes the API as a container image to GitHub Container Registry when API code reaches main, but only
# once its tests pass. The Azure web app runs this image and pulls the latest one when it restarts.
# The connection string and Firebase project id live in the web app's settings on Azure, not here.
name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
  workflow_dispatch:

permissions:
  contents: read

# Never run two publishes at once, and never cancel one halfway
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  test:
    name: API
    uses: ./.github/workflows/api-tests.yml

  image:
    name: Publish the container image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Registry paths must be lowercase, and the owner name may not be
      - name: Work out the image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loadwatch-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          # Reuses unchanged layers, such as the NuGet restore, from earlier runs
          cache-from: type=gha
          cache-to: type=gha,mode=max
